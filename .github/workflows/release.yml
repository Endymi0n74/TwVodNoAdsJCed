name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check @version matches tag
        run: |
          VERSION=$(grep -m1 '@version' combined/twitch-combined.user.js | awk '{print $2}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::@version ($VERSION) ne correspond pas au tag ($TAG)"
            exit 1
          fi
          echo "Version $VERSION OK"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: combined/twitch-combined.user.js
          generate_release_notes: true
