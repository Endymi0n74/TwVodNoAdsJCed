name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npx prettier --check src/ build.js

      - name: Syntax check (node --check)
        run: node build.js && node --check combined/twitch-combined.user.js

      - name: Run test harness (buildVodPlaylist)
        run: node combined/test-buildVodPlaylist.js

      - name: Run unit tests (stripAdSegments, parseAttributes, hookFetch)
        run: node combined/test-unit.js
